    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem('nk_theme');
          if (savedTheme === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
          var savedDensity = localStorage.getItem('nk_density');
          if (savedDensity === 'relaxed') {
            document.documentElement.classList.remove('tight-mode');
          } else {
            document.documentElement.classList.add('tight-mode');
          }
        } catch (_) {}
      })();
    </script>
